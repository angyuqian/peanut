<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Peanut</title>
<meta name="theme-color" content="#F1F4E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1A17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peanut">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Mali:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4E8; --surface:#FFFDF8; --surface2:#F6F2E8; --ink:#3A2A22; --muted:#76665A; --line:#E3DBCB;
  --pb:#D89B4A; --pb-ink:#7E5017; --pb-soft:#F7E4C3; --shell:#EBCF9E; --shell-dot:#C79A5B;
  --jelly:#C8436E; --jelly-soft:#F9DDE6; --sage:#4F8661; --sage-soft:#DCEBDD; --sky:#4F7FA6; --sky-soft:#DDEAF4;
  --alarm:#B42318; --alarm-soft:#FDE6E2; --sticky:#FFF0A6; --on-jelly:#FFFFFF;
  --mood:#D4507A; --energy:#B9852C; --sleep:#9DBAD3; --chart-surface:#FFFDF8;
  --shadow:0 1px 0 rgba(58,42,34,.05), 0 10px 28px -16px rgba(58,42,34,.28);
  --fd:'Fredoka', ui-rounded, system-ui, sans-serif; --fb:'Nunito', system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1F1A17; --surface:#2B2420; --surface2:#342B26; --ink:#F3E9DF; --muted:#B9A999; --line:#463A31;
    --pb:#E0A85A; --pb-ink:#F2C487; --pb-soft:#4A3923; --shell:#C9A26A; --shell-dot:#8E6B3C;
    --jelly:#EE85A6; --jelly-soft:#4B2733; --sage:#8DC39D; --sage-soft:#273A2D; --sky:#9CC3E0; --sky-soft:#22323D;
    --alarm:#FF9A8B; --alarm-soft:#4A221D; --sticky:#FFE98A; --on-jelly:#2A1018;
    --mood:#D65D86; --energy:#B4863A; --sleep:#4E6C84; --chart-surface:#2B2420;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 28px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pb-ink)}
:focus-visible{outline:3px solid var(--pb);outline-offset:2px;border-radius:8px}
.wrap{max-width:660px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:.2px}
.grow{flex:1}
.sync{border:0;background:var(--surface);border-radius:99px;padding:5px 11px 5px 9px;font-size:12.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--sage);display:inline-block}
.sync[data-s="saving"] i,.sync[data-s="pending"] i{background:var(--pb);animation:pulse 1s infinite alternate}
.sync[data-s="offline"] i,.sync[data-s="error"] i{background:var(--alarm)}
.sync[data-s="local"] i,.sync[data-s="notoken"] i{background:var(--sky)}
@keyframes pulse{to{opacity:.35}}
h1{font-family:var(--fd);font-weight:600;font-size:28px;line-height:1.15;margin:14px 0 6px}
h2{font-family:var(--fd);font-weight:500;font-size:20px;line-height:1.2;margin:30px 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--fb);font-size:13.5px;font-weight:700;color:var(--muted)}
h3{font-family:var(--fd);font-weight:500;font-size:17px;margin:18px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.panel{background:var(--surface);border-radius:22px;padding:6px 16px;box-shadow:var(--shadow)}
.panel.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.panel>.row:first-child,.panel>.rows>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;line-height:1.3}
.row .s{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tap{cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.tap:hover .t{text-decoration:underline;text-decoration-color:var(--pb);text-underline-offset:3px}
.price{font-family:var(--fd);font-weight:500;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;font-size:15px;cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.pb{background:var(--pb);color:#2C1D10}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{color:var(--alarm)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:7px 13px;font-weight:700;font-size:14px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--pb-soft);box-shadow:inset 0 0 0 1.5px var(--pb)}
.chip .n{font-weight:800;color:var(--muted);font-size:12.5px}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:16px;margin:8px 0 4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=url],input[type=tel],input:not([type]),select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:76px;resize:vertical}
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:13.5px;font-weight:800;color:var(--muted);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=checkbox].box{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-content:center;margin:0}
input[type=checkbox].box:checked{background:var(--sage);border-color:var(--sage)}
input[type=checkbox].box:checked::after{content:"";width:11px;height:6px;border:solid var(--surface);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}
select.st{width:auto;min-height:0;appearance:none;-webkit-appearance:none;border:0;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:800;cursor:pointer;background:var(--surface2);color:var(--muted)}
.st-todo{background:var(--jelly-soft)!important;color:var(--jelly)!important}
.st-us{background:var(--sky-soft)!important;color:var(--sky)!important}
.st-ordered{background:var(--pb-soft)!important;color:var(--pb-ink)!important}
.st-bought,.st-gift{background:var(--sage-soft)!important;color:var(--sage)!important}
.st-skip{text-decoration:line-through}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.mom{background:var(--jelly-soft);color:var(--jelly)}
.tag.dad{background:var(--sky-soft);color:var(--sky)}
.tag.both{background:var(--pb-soft);color:var(--pb-ink)}
.tag.late{background:var(--alarm-soft);color:var(--alarm)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pb);border-radius:99px}
.bar.sage>i{background:var(--sage)}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 6px;font-weight:700}
.stat b{font-family:var(--fd);font-weight:500}
/* hero */
.hero{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin:8px 0 6px}
.hero .big{font-family:var(--fd);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.5px}
.hero .big small{font-size:22px;font-weight:500}
.hero .when{color:var(--muted);font-weight:700;margin-top:6px}
.hero .fruit{margin-top:10px;font-size:15.5px}
.hero .fruit b{font-weight:800}
.peanut-wrap{position:relative;width:150px;height:150px}
.peanut-wrap svg{display:block}
.wiggle{transform-origin:50% 90%;animation:wig 1.4s ease-in-out .2s 1}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){.wiggle,.sync i{animation:none!important}}
.sticky{background:var(--sticky);color:#3A2A22;padding:12px 14px;border-radius:6px 6px 16px 6px;transform:rotate(-1deg);box-shadow:0 8px 18px -12px rgba(0,0,0,.45);font-weight:800;margin:14px 4px}
.alert{background:var(--alarm-soft);border-radius:16px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start;font-weight:700}
.alert .ic{flex:none;width:24px;height:24px;border-radius:50%;background:var(--alarm);color:var(--alarm-soft);display:grid;place-content:center;font-weight:900;font-size:15px;line-height:1}
.soft{background:var(--pb-soft);border-radius:18px;padding:14px 16px;margin:12px 0}
.soft.sky{background:var(--sky-soft)}
/* pickers */
.picks{display:flex;gap:6px}
.pick{flex:1;position:relative}
.pick input{position:absolute;opacity:0;inset:0;pointer-events:none}
.pick span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;border-radius:14px;background:var(--surface2);cursor:pointer;font-size:12px;font-weight:800;color:var(--muted);text-align:center;line-height:1.2;box-shadow:inset 0 0 0 1.5px transparent}
.pick span em{font-style:normal;font-size:24px;line-height:1.1}
.pick input:checked+span{background:var(--pb-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--pb)}
.pick input:focus-visible+span{outline:3px solid var(--pb);outline-offset:2px}
.tg{position:relative}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg span{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13.5px;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);cursor:pointer}
.tg input:checked+span{background:var(--pb-soft);box-shadow:inset 0 0 0 1.5px var(--pb)}
.tg.red span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--alarm)}
.tg.red input:checked+span{background:var(--alarm-soft);box-shadow:inset 0 0 0 1.5px var(--alarm)}
.tg input:focus-visible+span{outline:3px solid var(--pb);outline-offset:2px}
.qlabel{font-weight:800;font-size:14px;margin:16px 0 8px}
/* timeline */
ol.tl{list-style:none;margin:0;padding:4px 0}
ol.tl li{display:grid;grid-template-columns:96px 18px 1fr;gap:10px;align-items:start;position:relative;padding:8px 0}
ol.tl li::before{content:"";position:absolute;left:104px;top:0;bottom:0;width:2px;background:var(--line)}
ol.tl li:first-child::before{top:16px}
ol.tl li:last-child::before{bottom:calc(100% - 16px)}
ol.tl .d{font-weight:800;font-size:13.5px;color:var(--muted);text-align:right;padding-top:1px}
ol.tl .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--pb);margin-top:4px;position:relative;z-index:1}
ol.tl li.past .dot{background:var(--pb)}
ol.tl li.now .dot{border-color:var(--jelly);background:var(--jelly)}
ol.tl .x b{display:block;line-height:1.3}
ol.tl .x span{font-size:13.5px;color:var(--muted)}
/* chart */
.legend{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px;padding:3px 10px;box-sizing:content-box;border-radius:99px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{background:var(--pb-soft)}
/* sheet */
dialog.sheet{border:0;padding:0;width:min(660px,100%);max-width:100%;max-height:90vh;margin:auto auto 0;border-radius:26px 26px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -10px 40px -10px rgba(0,0,0,.35)}
dialog.sheet::backdrop{background:rgba(31,26,23,.45)}
dialog.sheet form{padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
dialog.sheet h3{margin-top:0;font-size:21px}
.acts{display:flex;gap:8px;align-items:center;margin-top:18px;flex-wrap:wrap}
@media (min-width:720px){dialog.sheet{margin:auto;border-radius:26px}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.2s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate .card{width:min(440px,100%);background:var(--surface);border-radius:28px;padding:26px 22px;box-shadow:var(--shadow)}
.gate h1{margin-top:12px}
.err{color:var(--alarm);font-weight:800;margin-top:10px;min-height:1.5em}
.names .hearts{display:flex;gap:2px}
.hb{border:0;background:none;padding:2px;cursor:pointer;font-size:19px;line-height:1;filter:grayscale(1);opacity:.35}
.hb.on{filter:none;opacity:1}
.who{font-size:12px;font-weight:800;color:var(--muted);width:34px;text-align:right}
.empty{padding:18px 0;color:var(--muted);text-align:center;font-weight:700}
.x-btn{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px;line-height:1}
details summary{cursor:pointer;font-weight:800;padding:12px 0;color:var(--muted)}
.call{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.hero{grid-template-columns:118px 1fr;gap:12px}.peanut-wrap{width:118px;height:118px}.hero .big{font-size:34px}}
/* home scene */
.scene{position:relative;background:var(--pb-soft);border-radius:30px;padding:18px 18px 16px;margin:6px 0 4px;overflow:hidden}
.scene-top{display:grid;grid-template-columns:1fr 124px;gap:8px;align-items:center;position:relative}
.scene .big{font-family:var(--fd);font-weight:600;font-size:46px;line-height:1;letter-spacing:-.5px}
.scene .big small{font-size:22px;font-weight:500;margin-left:2px}
.scene .sub{font-weight:800;margin-top:8px;font-size:16.5px}
.scene .size{margin-top:8px;font-size:14.5px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center;line-height:1.3}
.scene .emo{font-size:28px;line-height:1}
.scene .peanut-wrap{width:124px;height:124px}
.scene .peanut-wrap>div{inset:18px 28px!important}
.deco{position:absolute;pointer-events:none}
.bubble{position:relative;background:var(--surface);border-radius:24px;padding:14px 16px 14px;margin-top:14px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;top:-11px;right:50px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:12px solid var(--surface)}
.hand{font-family:'Mali',var(--fd);font-weight:600;font-size:19px;line-height:1.38;margin:0}
.hand.sm{font-size:16.5px}
.sig{font-family:'Mali',var(--fd);font-weight:600;font-size:15px;color:var(--muted);text-align:right;margin-top:2px}
.sig::before{content:"♡ "}
.bubble-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.fwd{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--line)}
.fwd .hand{margin:4px 0 10px}
/* love */
.love{margin-top:14px}
.love-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.jelly{background:var(--jelly);color:var(--on-jelly)}
.love-line{font-weight:700;color:var(--muted);font-size:14.5px;margin:10px 4px 0}
.env{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;border:0;cursor:pointer;background:var(--jelly-soft);color:var(--ink);border-radius:20px;padding:58px 16px 16px;margin-top:12px;overflow:hidden}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:54px;background:color-mix(in srgb,var(--jelly) 22%,var(--jelly-soft));clip-path:polygon(0 0,100% 0,50% 100%)}
.env .seal{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;background:var(--jelly);display:grid;place-content:center;font-size:20px;box-shadow:0 6px 14px -6px rgba(200,67,110,.7)}
.env b{font-family:var(--fd);font-weight:500;font-size:18px;margin-top:14px}
.paper{background:var(--sticky);color:#3A2A22;border-radius:6px 6px 18px 6px;padding:14px 16px 10px;transform:rotate(-1deg);box-shadow:0 10px 20px -14px rgba(0,0,0,.5);margin:14px 4px 0}
.paper .sig{color:#7a6650}
.heartfx{position:fixed;z-index:40;pointer-events:none;font-size:22px;animation:floatup 1.1s ease-out forwards;opacity:0}
@keyframes floatup{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),-110px) scale(1.25);opacity:0}}
/* quick mood */
.pick-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;border-radius:14px;background:var(--surface2);border:0;cursor:pointer;font-size:12px;font-weight:800;color:var(--muted);line-height:1.2}
.pick-btn em{font-style:normal;font-size:26px;line-height:1.1}
.pick-btn.on{background:var(--pb-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--pb)}
/* stickers */
.stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stk{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--ink);text-align:center}
.stk-ring{position:relative;width:72px;height:72px;display:block}
.stk-ring>span{position:absolute;inset:0;display:grid;place-content:center;font-size:26px}
.stk b{font-size:14px;margin-top:4px;line-height:1.2}
/* baby */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qgrid.sm{margin-top:12px}

<body>
<div id="app"></div>
<dialog id="sheet" class="sheet"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   Peanut. A private, encrypted family dashboard.
   This file holds no personal data. Everything personal lives
   in an AES-GCM encrypted vault (passphrase never leaves the device).
   ========================================================= */

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const now = () => Date.now();
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => ymd(new Date(parseD(s).getTime() + n * DAY));
const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / DAY);
const yr = d => d.getFullYear() === new Date().getFullYear() ? {} : { year: 'numeric' };
const fmtD = s => { if (!s) return ''; const d = parseD(s); return d.toLocaleDateString('en-SG', { day: 'numeric', month: 'short', ...yr(d) }); };
const fmtDW = s => { if (!s) return ''; const d = parseD(s); return d.toLocaleDateString('en-SG', { weekday: 'short', day: 'numeric', month: 'short', ...yr(d) }); };
const money = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '' :
  '$' + Number(n).toLocaleString('en-SG', { minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
const sum = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;

/* ---------- crypto ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const ITER = 600000;
function b64e(bytes){ let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(str){ const s = atob(str); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
const utf8b64 = str => b64e(enc.encode(str));
const b64utf8 = str => dec.decode(b64d(str.replace(/\s/g, '')));
async function deriveKey(pass, saltB64, iter){
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(saltB64), iterations: iter || ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}
async function seal(key, str){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(str)));
  return { v: 1, iv: b64e(iv), ct: b64e(ct) };
}
async function unseal(key, box){
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(box.iv) }, key, b64d(box.ct));
  return dec.decode(pt);
}
const exportKey = async k => b64e(new Uint8Array(await crypto.subtle.exportKey('raw', k)));
const importKey = async s => crypto.subtle.importKey('raw', b64d(s), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);

/* ---------- state ---------- */
const COLLS = ['registry','bags','tasks','appts','money','nannies','centres','books','names','checkins','care','needs','links','jar','hugs','log'];
const Store = { cfg: null, key: null, token: null, data: null, sha: null, dirty: false, rev: 0, saving: false, again: false,
  timer: null, status: 'synced', statusMsg: '', lastSync: 0, needsRender: false, flags: [], chart: null,
  ui: { tab: LS.get('peanut.tab') || 'home', gear: 'registry', regFilter: 'all', more: 'names', plan: 'open', owner: 'all' } };
const D = () => Store.data;
const M = () => Store.data.meta;
const live = c => (Store.data[c] || []).filter(r => !r.del);
const me = () => LS.get('peanut.me') || '';
const nameOf = role => role === 'mom' ? (M().mom || 'Mama') : role === 'dad' ? (M().dad || 'Papa') : role === 'both' ? 'Both' : '';
const CACHE = 'peanut.cache', KEYSTORE = 'peanut.key', LOCALCFG = 'peanut.local';

function blankData(){
  const d = { schema: 1, meta: { u: now(), edd: '', birth: '', mom: 'Mama', dad: 'Papa', nick: 'Peanut', surname: '',
    cc: { name: '', options: [], days: 0, checkIn: '' }, nannyName: '', nannyStart: '', hospital: '', deliveryPhone: '',
    gynae: '', gynaePhone: '', rule: '', momPhone: '' } };
  COLLS.forEach(c => d[c] = []);
  return d;
}
function normalise(d){
  const b = blankData();
  d.meta = Object.assign(b.meta, d.meta || {});
  d.meta.cc = Object.assign({ name: '', options: [], days: 0, checkIn: '' }, d.meta.cc || {});
  COLLS.forEach(c => { if (!Array.isArray(d[c])) d[c] = []; });
  return d;
}
function merge(a, b){
  if (!a) return normalise(b); if (!b) return normalise(a);
  const out = { schema: 1, meta: (a.meta?.u || 0) >= (b.meta?.u || 0) ? a.meta : b.meta };
  for (const c of COLLS){
    const m = new Map();
    for (const r of (a[c] || [])) m.set(r.id, r);
    for (const r of (b[c] || [])){ const x = m.get(r.id); if (!x || (r.u || 0) > (x.u || 0)) m.set(r.id, r); }
    out[c] = [...m.values()];
  }
  return normalise(out);
}

/* ---------- mutations ---------- */
function upsert(c, r){
  r.u = now();
  const arr = D()[c] || (D()[c] = []);
  const i = arr.findIndex(x => x.id === r.id);
  if (i < 0) arr.push(r); else arr[i] = r;
  touch();
}
function patch(c, id, fields){
  const r = (D()[c] || []).find(x => x.id === id); if (!r) return;
  Object.assign(r, fields, { u: now() }); touch();
}
const removeRec = (c, id) => patch(c, id, { del: true });
function purge(){
  const cut = now() - 30 * DAY;
  for (const c of COLLS){ const a = D()[c]; if (a && a.some(r => r.del && (r.u || 0) < cut)) D()[c] = a.filter(r => !(r.del && (r.u || 0) < cut)); }
}
function setMeta(fields){ Object.assign(M(), fields, { u: now() }); touch(); }

/* ---------- GitHub sync ---------- */
const GH = 'https://api.github.com';
async function ghReq(method, path, body){
  const headers = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (Store.token) headers.Authorization = 'Bearer ' + Store.token;
  if (body) headers['Content-Type'] = 'application/json';
  return fetch(GH + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
}
async function ghErr(r){
  let m = ''; try { m = (await r.json()).message || ''; } catch {}
  if (r.status === 401) return 'GitHub rejected the token (expired or revoked?)';
  if (r.status === 403) return 'GitHub refused: ' + (m || 'token lacks Contents write access');
  if (r.status === 404) return 'GitHub says not found. Check owner, repo and token access';
  return `GitHub error ${r.status}${m ? ': ' + m : ''}`;
}
const gh = {
  repoPath(){ const c = Store.cfg; return `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`; },
  async getFile(path, branch){
    const r = await ghReq('GET', `${gh.repoPath()}/contents/${path}?ref=${encodeURIComponent(branch)}&t=${now()}`);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(await ghErr(r));
    const j = await r.json();
    let content = j.content || '';
    if ((!content || j.encoding === 'none') && j.size > 0){
      // files over 1 MB come back without content; fetch the blob instead
      const br = await ghReq('GET', `${gh.repoPath()}/git/blobs/${j.sha}`);
      if (!br.ok) throw new Error(await ghErr(br));
      content = (await br.json()).content || '';
    }
    return { sha: j.sha, text: b64utf8(content) };
  },
  async putFile(path, branch, text, sha, message){
    const body = { message: message || 'Peanut sync', content: utf8b64(text), branch };
    if (sha) body.sha = sha;
    const r = await ghReq('PUT', `${gh.repoPath()}/contents/${path}`, body);
    if (r.status === 409 || r.status === 422){ const e = new Error('conflict'); e.conflict = true; throw e; }
    if (!r.ok) throw new Error(await ghErr(r));
    return (await r.json()).content.sha;
  },
  get(){ return gh.getFile(Store.cfg.path, Store.cfg.branch); },
  put(text, sha){ return gh.putFile(Store.cfg.path, Store.cfg.branch, text, sha); },
};

function setStatus(s, msg){
  Store.status = s; Store.statusMsg = msg || '';
  if (s === 'synced') Store.lastSync = now();
  const el = $('#sync'); if (el){ el.dataset.s = s; el.querySelector('span').textContent = statusText(); el.title = Store.statusMsg || ''; }
}
function statusText(){
  return ({ synced: 'Synced', pending: 'Saving', saving: 'Saving', local: 'On this phone', notoken: 'Not syncing yet', offline: 'Offline, kept here', error: 'Sync problem' })[Store.status] || '';
}
async function cacheLocal(){
  // keep an encrypted copy on this device so offline edits survive a reload
  const box = await seal(Store.key, JSON.stringify(D()));
  if (Store.cfg.mode === 'local') LS.set(LOCALCFG + '.blob', JSON.stringify(box));
  else LS.set(CACHE, JSON.stringify({ sha: Store.sha, dirty: Store.dirty, box, repo: Store.cfg.owner + '/' + Store.cfg.repo }));
}
function touch(){ Store.rev++; Store.dirty = true; cacheLocal(); scheduleSave(); }
function scheduleSave(){ clearTimeout(Store.timer); Store.timer = setTimeout(save, 1200); if (Store.cfg.mode !== 'local') setStatus('pending'); }
async function save(){
  if (Store.saving){ Store.again = true; return; }
  if (!Store.dirty) return;
  Store.saving = true;
  const rev = Store.rev;
  try {
    purge();
    if (Store.cfg.mode !== 'local' && !Store.token){ await cacheLocal(); setStatus('notoken'); return; }
    if (Store.cfg.mode === 'local'){ Store.dirty = Store.rev !== rev; await cacheLocal(); setStatus('local'); }
    else {
      setStatus('saving');
      let ok = false, merged = false;
      for (let attempt = 0; attempt < 4 && !ok; attempt++){
        const text = JSON.stringify(await seal(Store.key, JSON.stringify(D())));
        try {
          Store.sha = await gh.put(text, Store.sha);
          ok = true;
        } catch (e){
          if (!e.conflict) throw e;
          const r = await gh.get();
          if (r){ Store.data = merge(D(), JSON.parse(await unseal(Store.key, JSON.parse(r.text)))); Store.sha = r.sha; merged = true; }
          else Store.sha = null;
          await new Promise(res => setTimeout(res, 300 * (attempt + 1)));
        }
      }
      if (!ok) throw new Error('Kept clashing with another device. Will retry.');
      Store.dirty = Store.rev !== rev; await cacheLocal();
      setStatus(Store.dirty ? 'pending' : 'synced');
      if (merged) renderSafe();
    }
  } catch (e){
    setStatus(navigator.onLine === false ? 'offline' : 'error', e.message);
  } finally {
    Store.saving = false;
    if (Store.again || Store.dirty){ Store.again = false; if (Store.dirty && Store.status !== 'error' && Store.status !== 'offline' && Store.status !== 'notoken') scheduleSave(); }
  }
}
async function pickUpToken(){
  try {
    const r = await fetch('config.json?t=' + now(), { cache: 'no-store' }); if (!r.ok) return;
    const j = await r.json(); if (!j.token || j.salt !== Store.cfg.salt) return;
    Store.token = await unseal(Store.key, j.token); Store.cfg = { ...j, mode: 'github' }; LS.set('peanut.ghcfg', JSON.stringify(j));
  } catch {}
}
async function refresh(){
  if (!Store.data || Store.cfg.mode === 'local' || Store.saving) return;
  if (!Store.token) await pickUpToken();
  if (Store.dirty && Store.token){ save(); return; }
  try {
    const r = await gh.get();
    if (r && r.sha !== Store.sha){
      const remote = JSON.parse(await unseal(Store.key, JSON.parse(r.text)));
      Store.data = merge(remote, D()); Store.sha = r.sha; await cacheLocal(); renderSafe();
    }
    setStatus(Store.token ? 'synced' : 'notoken');
  } catch (e){ setStatus(navigator.onLine === false ? 'offline' : 'error', e.message); }
}
let lastPoll = now();
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (now() - lastPoll >= (Store.token ? 45000 : 180000)){ lastPoll = now(); refresh(); } // GitHub allows 60 unsigned reads an hour
}, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
window.addEventListener('online', () => refresh());

/* ---------- boot, setup, unlock ---------- */
async function loadConfig(){
  try {
    const r = await fetch('config.json?t=' + now(), { cache: 'no-store' });
    if (r.ok){ const j = await r.json(); if (j && j.salt && j.owner){ LS.set('peanut.ghcfg', JSON.stringify(j)); return { ...j, mode: 'github' }; } }
  } catch {}
  // Pages can lag a minute behind a fresh setup; fall back to the copy this device saved
  const gc = LS.get('peanut.ghcfg'); if (gc) try { return { ...JSON.parse(gc), mode: 'github' }; } catch {}
  const l = LS.get(LOCALCFG); if (l) try { return { ...JSON.parse(l), mode: 'local' }; } catch {}
  return null;
}
async function boot(){
  Store.cfg = await loadConfig();
  if (!Store.cfg) return renderSetup();
  const saved = LS.get(KEYSTORE);
  if (saved){
    try {
      const s = JSON.parse(saved);
      if (s.salt === Store.cfg.salt){ await openVault(await importKey(s.k)); return; }
    } catch (e){ console.warn('Saved key failed', e); }
    LS.del(KEYSTORE);
  }
  renderUnlock();
}
async function openVault(key){
  Store.key = key;
  if (Store.cfg.mode === 'local'){
    const blob = LS.get(LOCALCFG + '.blob');
    Store.data = normalise(JSON.parse(await unseal(key, JSON.parse(blob))));
    Store.dirty = false; setStatus('local');
  } else {
    Store.token = Store.cfg.token ? await unseal(key, Store.cfg.token) : null;
    let cached = null;
    try { const c = JSON.parse(LS.get(CACHE) || 'null'); if (c && c.repo === Store.cfg.owner + '/' + Store.cfg.repo) cached = c; } catch {}
    let cachedData = null;
    if (cached){ try { cachedData = JSON.parse(await unseal(key, cached.box)); } catch { cachedData = null; } }
    try {
      const r = await gh.get();
      if (!r) throw new Error('No vault file found in the repo yet');
      const remote = JSON.parse(await unseal(key, JSON.parse(r.text)));
      Store.sha = r.sha;
      if (cachedData && cached.dirty){ Store.data = merge(remote, cachedData); Store.dirty = true; }
      else { Store.data = normalise(remote); Store.dirty = false; }
      setStatus(Store.token ? 'synced' : 'notoken');
    } catch (e){
      if (!cachedData) throw e;
      Store.data = normalise(cachedData); Store.sha = cached.sha; Store.dirty = !!cached.dirty;
      setStatus(navigator.onLine === false ? 'offline' : 'error', e.message);
    }
    await cacheLocal();
    if (Store.dirty) scheduleSave();
  }
  renderApp();
  if (!me()) askWho();
}
function repoGuess(){
  const h = location.hostname, m = /^([^.]+)\.github\.io$/i.exec(h);
  if (!m) return { owner: '', repo: '' };
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return { owner: m[1], repo: seg && !seg.includes('.') ? seg : `${m[1]}.github.io` };
}
function gateShell(inner){ return `<div class="gate"><div class="card">${peanutSVG(84, true)}${inner}</div></div>`; }
function renderSetup(){
  const g = repoGuess();
  const onPages = !!g.owner;
  $('#app').innerHTML = gateShell(`
    <h1>Set up Peanut</h1>
    <p class="muted">Everything is encrypted with your passphrase before it leaves this device. The site is public; the data isn't.</p>
    <form data-s="setup" autocomplete="off">
      <label class="f"><span>Passphrase</span><input name="pass" type="password" autocomplete="new-password" minlength="10" required></label>
      <label class="f"><span>Same again</span><input name="pass2" type="password" autocomplete="new-password" required></label>
      <p class="small muted">Four or more random words works well. There is no reset. Lose it and the data is gone, so write it down somewhere safe.</p>
      <label class="f"><span>Starter data (optional)</span><input name="seed" type="file" accept=".json,application/json"></label>
      <label class="f"><span>Due date</span><input name="edd" type="date" required></label>
      <div class="qlabel">Where should it live?</div>
      <div class="chips">
        <label class="tg"><input type="radio" name="mode" value="github" ${onPages ? 'checked' : ''}><span>Sync both phones via GitHub</span></label>

async function doSetup(f){
  const err = $('#err'); err.textContent = '';
  const pass = f.pass.value, mode = f.mode.value;
  if (pass.length < 10) return err.textContent = 'Use at least 10 characters.';
  if (pass !== f.pass2.value) return err.textContent = "The two passphrases don't match.";
  if (!f.edd.value) return err.textContent = 'Add the due date.';
  let data = blankData();
  if (f.seed.files[0]){
    try { data = normalise(JSON.parse(await f.seed.files[0].text())); }
    catch { return err.textContent = "Couldn't read the starter file."; }
  }
  data.meta.edd = f.edd.value; data.meta.u = now();
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Encrypting';
  try {
    const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
    const key = await deriveKey(pass, salt, ITER);
    if (mode === 'local'){
      Store.cfg = { mode: 'local', v: 1, salt, iter: ITER };
      LS.set(LOCALCFG, JSON.stringify({ v: 1, salt, iter: ITER }));
      Store.key = key; Store.data = data;
      await cacheLocal(); setStatus('local');
    } else {
      const owner = f.owner.value.trim(), repo = f.repo.value.trim(), token = f.token.value.trim();
      if (!owner || !repo || !token) throw new Error('Fill in owner, repo and token.');
      Store.token = token;
      Store.cfg = { mode: 'github', v: 1, owner, repo, branch: 'peanut-data', path: 'peanut.vault.json', salt, iter: ITER };
      btn.textContent = 'Talking to GitHub';
      const rr = await ghReq('GET', gh.repoPath());
      if (!rr.ok) throw new Error(await ghErr(rr));
      const repoInfo = await rr.json();
      const main = repoInfo.default_branch || 'main';
      const ref = await ghReq('GET', `${gh.repoPath()}/git/ref/heads/peanut-data`);
      if (ref.status === 404){
        const base = await ghReq('GET', `${gh.repoPath()}/git/ref/heads/${encodeURIComponent(main)}`);
        if (!base.ok) throw new Error(await ghErr(base));
        const sha = (await base.json()).object.sha;
        const mk = await ghReq('POST', `${gh.repoPath()}/git/refs`, { ref: 'refs/heads/peanut-data', sha });
        if (!mk.ok) throw new Error(await ghErr(mk));
      } else if (!ref.ok) throw new Error(await ghErr(ref));
      if (await gh.get()) throw new Error('This repo already has a Peanut vault. Wait for Pages to update and unlock it instead, or delete peanut.vault.json on the peanut-data branch to start over.');
      Store.key = key; Store.data = data;
      Store.sha = await gh.put(JSON.stringify(await seal(key, JSON.stringify(data))), null);
      const pub = { v: 1, owner, repo, branch: 'peanut-data', path: 'peanut.vault.json', salt, iter: ITER, check: await seal(key, 'peanut'), token: await seal(key, token) };
      const existing = await gh.getFile('config.json', main);
      await gh.putFile('config.json', main, JSON.stringify(pub, null, 2) + '\n', existing?.sha, 'Peanut: add encrypted config');
      Store.cfg = { ...pub, mode: 'github' };
      LS.set('peanut.ghcfg', JSON.stringify(pub));
      Store.dirty = false; await cacheLocal(); setStatus('synced');
    }
    LS.set(KEYSTORE, JSON.stringify({ salt, k: await exportKey(key) }));
    renderApp(); askWho();
  } catch (e){
    err.textContent = e.message || String(e);
    btn.disabled = false; btn.textContent = 'Create Peanut';
  }
}
async function doUnlock(f){
  const err = $('#err'); err.textContent = '';
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Opening';
  try {
    const key = await deriveKey(f.pass.value, Store.cfg.salt, Store.cfg.iter);
    try {
      if (Store.cfg.mode === 'local') await unseal(key, JSON.parse(LS.get(LOCALCFG + '.blob')));
      else await unseal(key, Store.cfg.check || Store.cfg.token);
    } catch { throw new Error("That's not the passcode."); }
    LS.set(KEYSTORE, JSON.stringify({ salt: Store.cfg.salt, k: await exportKey(key) }));
    await openVault(key);
  } catch (e){
    err.textContent = e.message || String(e);
    btn.disabled = false; btn.textContent = 'Open';
  }
}
function lock(){
  LS.del(KEYSTORE); Store.key = null; Store.token = null; Store.data = null; renderUnlock();
}

function gest(){
  const m = M(); if (!m.edd) return null;
  const left = diffDays(m.edd, today()); const ga = 280 - left;
  return { ga, w: Math.floor(ga / 7), d: ((ga % 7) + 7) % 7, left };
}
const phase = () => M().birth ? 'after' : 'pregnant';
function ageText(){
  const n = diffDays(today(), M().birth);
  if (n < 0) return 'arriving soon';
  if (n < 14) return plural(n, 'day') + ' old';
  if (n < 70) return `${Math.floor(n / 7)} weeks ${n % 7 ? plural(n % 7, 'day') : ''} old`.replace(/\s+old/, ' old');
  return `${Math.floor(n / 30.44)} months old`;
}
function ccPlan(){
  const m = M(), cc = m.cc || {};
  if (!cc.days) return null;
  const base = m.birth || m.edd; if (!base) return null;
  const checkIn = cc.checkIn || addDays(base, 2);
  return { checkIn, end: addDays(checkIn, cc.days), assumed: !cc.checkIn };
}
function keyDates(){
  const m = M(), out = []; if (!m.edd && !m.birth) return out;
  if (!m.birth){
    out.push({ d: addDays(m.edd, -28), t: '36 weeks', s: 'Bags packed, car seat in' });
    out.push({ d: addDays(m.edd, -21), t: '37 weeks', s: 'Full term' });
    out.push({ d: m.edd, t: 'Due date', s: `${m.nick} day, in theory` });
  } else {
    out.push({ d: m.birth, t: `${m.nick} arrived`, s: '' });
    out.push({ d: addDays(m.birth, 28), t: 'Shared leave split due', s: 'Submit on LifeSG' });
    out.push({ d: addDays(m.birth, 42), t: 'Birth registration due', s: 'LifeSG' });
  }
  out.push({ d: '2027-02-05', t: 'CNY eve', s: 'Reunion dinner' });
  out.push({ d: '2027-02-06', t: 'Chinese New Year', s: 'Public holidays 6 to 8 Feb' });
  const cp = ccPlan();
  if (cp){
    out.push({ d: cp.checkIn, t: `${m.cc.name || 'Confinement centre'} check-in`, s: cp.assumed ? 'Assumes discharge 2 days after birth' : '' });
    out.push({ d: cp.end, t: `${m.cc.name || 'Confinement centre'} check-out`, s: `${m.cc.days} days` });
  }
  if (m.nannyStart){
    let s = '';
    if (cp){ const g = diffDays(m.nannyStart, cp.end);
      s = g > 0 ? `${plural(g, 'day')} with no help after check-out` : g < 0 ? `Overlaps the centre by ${plural(-g, 'day')}` : 'Starts the day you check out'; }
    out.push({ d: m.nannyStart, t: `${m.nannyName || 'Nanny'} starts`, s, warn: !!cp && diffDays(m.nannyStart, cp.end) !== 0 });
  }
  return out.filter(x => x.d).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
}
function dueOf(t){
  if (!t.due) return null;
  const b = /^birth\+(\d+)$/.exec(t.due);
  if (b) return M().birth ? addDays(M().birth, +b[1]) : null;
  return t.due;
}
function dueLabel(t){
  const b = /^birth\+(\d+)$/.exec(t.due || ''); const d = dueOf(t);
  if (!d) return b ? `${b[1]} days after birth` : '';
  if (t.done) return fmtD(d);
  const n = diffDays(d, today());
  if (n < 0) return `${-n}d overdue`; if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow';
  if (n < 14) return `In ${n} days`; return fmtD(d);
}

function lowMood(){
  const since = addDays(today(), -14);
  const recent = live('checkins').filter(c => c.date >= since && c.mood);
  if (recent.length < 4) return false;
  const avg = sum(recent, c => c.mood) / recent.length;
  const lowDays = new Set(recent.filter(c => c.mood <= 2).map(c => c.date)).size;
  return avg <= 2.4 || lowDays >= 5;
}

  const sel = (n, l, opts, v) => `<label class="f"><span>${l}</span><select name="${n}">${opts.map(([ov, ol]) => `<option value="${ov}" ${v === ov ? 'selected' : ''}>${ol}</option>`).join('')}</select></label>`;
  const note = `<label class="f"><span>Note</span><input name="note" value="${esc(r.note || '')}"></label>`;

  else if (T === 'feed'){ title = 'Breastfeed'; f = `${sel('side', 'Side', [['L', 'Left'], ['R', 'Right'], ['B', 'Both']], r.side)}${dt('at', 'Started', r.at)}${num('mins', 'Minutes (blank if still feeding)', mins, '1')}`; }
  else if (T === 'diaper'){ title = 'Diaper'; f = `${sel('diaper', 'Kind', [['wet', 'Wet'], ['dirty', 'Poo'], ['both', 'Both']], r.diaper)}${dt('at', 'When', r.at)}${note}`; }

  else { title = 'Note'; f = `<label class="f"><span>Note</span><textarea name="note" rows="3">${esc(r.note || '')}</textarea></label>${dt('at', 'When', r.at)}`; }

    <div class="acts">${id ? `<button type="button" class="btn ghost danger" data-a="bdel" data-id="${id}">Delete</button>` : ''}<span class="grow"></span>

function trendChart(){
  const days = 21, start = addDays(today(), -(days - 1));
  const cis = live('checkins').filter(c => c.date >= start);
  if (cis.length < 2){ Store.chart = null; return '<div class="empty">A couple of check-ins and the trend shows up here.</div>'; }
  const pts = [];
  for (let i = 0; i < days; i++){
    const d = addDays(start, i), cs = cis.filter(c => c.date === d);
    const avg = k => { const v = cs.filter(c => c[k]).map(c => c[k]); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    const sl = cs.filter(c => c.sleep != null).map(c => c.sleep);
    pts.push({ d, mood: avg('mood'), energy: avg('energy'), sleep: sl.length ? sl[sl.length - 1] : null });
  }
  Store.chart = pts;
  const W = 360, H = 150, L = 18, R = 50, T = 8, B = 20, ih = H - T - B, iw = W - L - R;
  const x = i => L + (i / (days - 1)) * iw, y = v => T + (1 - (v - 1) / 4) * ih;
  const line = (k) => { let dpath = '', pen = false;
    pts.forEach((p, i) => { if (p[k] == null){ pen = false; return; } dpath += `${pen ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p[k]).toFixed(1)} `; pen = true; });
    return dpath; };
  const dots = (k, col) => pts.map((p, i) => p[k] == null ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${y(p[k]).toFixed(1)}" r="4" fill="${col}" stroke="var(--chart-surface)" stroke-width="2"/>`).join('');
  const lastIdx = k => { for (let i = pts.length - 1; i >= 0; i--) if (pts[i][k] != null) return i; return -1; };
  const ly = {}; ['mood', 'energy'].forEach(k => { const i = lastIdx(k); if (i >= 0) ly[k] = y(pts[i][k]) + 4; });
  if (ly.mood != null && ly.energy != null && Math.abs(ly.mood - ly.energy) < 13){ const mid = (ly.mood + ly.energy) / 2, up = ly.mood <= ly.energy ? 'mood' : 'energy';
    ly[up] = mid - 6.5; ly[up === 'mood' ? 'energy' : 'mood'] = mid + 6.5; }
  const lab = (k, text) => { const i = lastIdx(k); return i < 0 ? '' : `<text x="${x(i) + 8}" y="${ly[k].toFixed(1)}" font-size="11" font-weight="800" fill="var(--muted)">${text}</text>`; };
  const SH = 56, sMax = 12, sy = v => SH - 4 - (Math.min(v, sMax) / sMax) * (SH - 12), bw = Math.min(10, iw / days - 3);
  const grid = [1, 3, 5].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${v}</text>`).join('');
  const xt = [0, 7, 14, 20].map(i => `<text x="${x(i)}" y="${H - 4}" text-anchor="${i === 0 ? 'start' : i === 20 ? 'end' : 'middle'}" font-size="10.5" fill="var(--muted)">${i === 20 ? 'Today' : esc(fmtD(addDays(start, i)))}</text>`).join('');
  return `<div class="legend"><span><i style="background:var(--mood)"></i>Mood</span><span><i style="background:var(--energy)"></i>Energy</span><span class="muted">1 low, 5 great</span></div>
  <div class="chart"><svg data-chart="mood" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mood and energy over the last 3 weeks">
    ${grid}${xt}
    <path d="${line('energy')}" fill="none" stroke="var(--energy)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line('mood')}" fill="none" stroke="var(--mood)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots('energy', 'var(--energy)')}${dots('mood', 'var(--mood)')}${lab('mood', 'Mood')}${lab('energy', 'Energy')}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    <rect class="hit" x="${L - 8}" y="0" width="${iw + 16}" height="${H}" fill="transparent"/>
  </svg><div class="tip"></div></div>
  <div class="legend" style="margin-top:12px"><span><i style="background:var(--sleep);height:8px"></i>Sleep (hours)</span></div>
  <div class="chart"><svg data-chart="sleep" viewBox="0 0 ${W} ${SH}" role="img" aria-label="Sleep hours over the last 3 weeks">
    <line x1="${L}" x2="${W - R}" y1="${SH - 4}" y2="${SH - 4}" stroke="var(--line)"/>
    <line x1="${L}" x2="${W - R}" y1="${sy(8)}" y2="${sy(8)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${W - R + 6}" y="${sy(8) + 4}" font-size="10.5" fill="var(--muted)">8h</text>
    ${pts.map((p, i) => p.sleep == null ? '' : `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${sy(p.sleep).toFixed(1)}" width="${bw.toFixed(1)}" height="${(SH - 4 - sy(p.sleep)).toFixed(1)}" rx="4" fill="var(--sleep)"><title>${esc(fmtD(p.d))}: ${p.sleep}h</title></rect>`).join('')}
  </svg></div>`;
}
function bindChart(){
  const svg = document.querySelector('svg[data-chart="mood"]'); if (!svg || !Store.chart) return;
  const tip = svg.parentElement.querySelector('.tip'), xh = svg.querySelector('.xh'), pts = Store.chart;
  const W = 360, L = 18, R = 50, iw = W - L - R;
  const move = e => {
    const r = svg.getBoundingClientRect(); const vx = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((vx - L) / iw * (pts.length - 1)))); const p = pts[i];
    const px = L + i / (pts.length - 1) * iw;
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('opacity', 1);
    const f = v => v == null ? 'none' : (Math.round(v * 10) / 10);
    tip.textContent = `${fmtDW(p.d)}: mood ${f(p.mood)}, energy ${f(p.energy)}${p.sleep != null ? `, ${p.sleep}h sleep` : ''}`;
    tip.style.left = Math.max(80, Math.min(r.width - 80, px / W * r.width)) + 'px'; tip.style.top = '14px'; tip.style.opacity = 1;
  };
  const leave = () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', leave);
}

function fieldHTML([k, label, type = 'text', req, opts], r){
  const v = r[k] ?? '';
  if (type === 'select'){
    const os = (typeof opts === 'function' ? opts() : opts).map(o => Array.isArray(o) ? o : [o, o]);
    return `<label class="f"><span>${label}</span><select name="${k}">${os.map(([ov, ol]) => `<option value="${esc(ov)}" ${String(v) === String(ov) ? 'selected' : ''}>${esc(ol)}</option>`).join('')}</select></label>`;
  }
  if (type === 'textarea') return `<label class="f"><span>${label}</span><textarea name="${k}" rows="3">${esc(v)}</textarea></label>`;
  if (type === 'check') return `<label class="tg" style="display:inline-block;margin-top:14px"><input type="checkbox" name="${k}" ${v ? 'checked' : ''}><span>${label}</span></label>`;
  if (type === 'due'){
    const b = /^birth\+(\d+)$/.exec(v);
    return `<div class="two"><label class="f"><span>Due date</span><input type="date" name="due" value="${b ? '' : esc(v)}"></label>
      <label class="f"><span>Or days after birth</span><input type="number" min="0" name="dueBirth" value="${b ? b[1] : ''}"></label></div>`;
  }
  return `<label class="f"><span>${label}</span><input name="${k}" type="${type}" ${type === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(v)}" ${req ? 'required' : ''}></label>`;
}
function openEditor(coll, id){

    <h3>${id ? 'Edit' : 'Add a'} ${sc.t}</h3>
    ${sc.f.map(f => fieldHTML(f, r)).join('')}
    <div class="acts">${id ? `<button type="button" class="btn ghost danger" data-a="del" data-coll="${coll}" data-id="${id}">Delete</button>` : ''}
      <span class="grow"></span><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn pb" type="submit">Save</button></div></form>`);
}

const S = {
  setup: f => doSetup(f),

  edit(f){
    const coll = f.dataset.coll, id = f.dataset.id, sc = SCHEMA[coll];
    const r = id ? { ...D()[coll].find(x => x.id === id) } : { id: uid(coll.slice(0, 2)), ...sc.d };
    for (const [k, , type] of sc.f){
      if (type === 'due'){ const b = f.elements.dueBirth.value; r.due = b !== '' ? `birth+${+b}` : f.elements.due.value; continue; }
      const el = f.elements[k]; if (!el) continue;
      if (type === 'check'){ r[k] = el.checked; continue; }
      let v = el.value.trim();
      if (type === 'number') v = v === '' ? null : Number(v);
      r[k] = v;
    }
    upsert(coll, r); closeSheet(); renderApp(); toast('Saved');
  },
  checkin(f){

    const r = { id: uid('ci'), at: new Date().toISOString(), date: today(), mood: num('mood'), energy: num('energy'), body: num('body'),

      tags: fd.getAll('tag'), note: (fd.get('note') || '').trim(), help: (fd.get('help') || '').trim(), by: me() };
    if (!r.mood && !r.energy && !r.body && r.sleep == null && !r.tags.length && !r.note && !r.moving && !r.help) return toast('Pick at least one thing');

  },
  need(f){ const t = f.text.value.trim(); if (!t) return; upsert('needs', { id: uid('nd'), text: t, date: today(), done: false, by: me() }); renderApp(); },
  care(f){ const t = f.what.value.trim(); if (!t) return; upsert('care', { id: uid('cr'), date: today(), what: t, by: me() }); renderApp(); toast('Logged. Nice one'); },
  bagadd(f){ const t = f.item.value.trim(); if (!t) return; upsert('bags', { id: uid('bg'), bag: f.dataset.bag, who: f.who.value, item: t, packed: false, notes: '' }); renderApp(); },
  async token(f){
    const t = f.token.value.trim(); if (!t) return;

      const pub = { v: 1, owner: Store.cfg.owner, repo: Store.cfg.repo, branch: Store.cfg.branch, path: Store.cfg.path, salt: Store.cfg.salt, iter: Store.cfg.iter, check: Store.cfg.check || await seal(Store.key, 'peanut'), token: await seal(Store.key, t) };
      const existing = await gh.getFile('config.json', main);
      await gh.putFile('config.json', main, JSON.stringify(pub, null, 2) + '\n', existing?.sha, 'Peanut: rotate token');
      Store.cfg = { ...pub, mode: 'github' }; LS.set('peanut.ghcfg', JSON.stringify(pub));
      f.reset(); toast('Syncing is on for both phones'); renderApp(); Store.dirty ? save() : refresh();
    } catch (e){ Store.token = old; toast(e.message); }
  },
  settings(f){
    const g = k => f.elements[k].value.trim();
    const opts = [[g('o1d'), g('o1c')], [g('o2d'), g('o2c')]].filter(([d, c]) => d && c).map(([d, c]) => ({ days: +d, cost: +c }));
    const cc = { ...M().cc, name: g('ccName'), options: opts, checkIn: g('ccCheckIn') };
    if (!opts.some(o => o.days === +cc.days)) cc.days = 0;
    setMeta({ edd: g('edd'), birth: g('birth'), nick: g('nick') || 'Peanut', surname: g('surname'), mom: g('mom') || 'Mama', dad: g('dad') || 'Papa',
      hospital: g('hospital'), deliveryPhone: g('deliveryPhone'), momPhone: g('momPhone'), gynae: g('gynae'), gynaePhone: g('gynaePhone'),
      nannyName: g('nannyName'), nannyStart: g('nannyStart'), rule: g('rule'), cc });
    renderApp(); toast('Settings saved');
  },
};
/* ---------- notes jar view ---------- */
function jarView(){
  const role = me(); if (!role) return '<div class="empty">Pick who you are in Settings first.</div>';
  const other = otherRole(role), on = esc(nameOf(other));
  const mine = live('jar').filter(n => n.by === role), theirs = live('jar').filter(n => n.by === other);
  const waiting = mine.filter(n => !n.shownOn).sort((a, b) => (a.created || 0) - (b.created || 0));
  const sent = mine.filter(n => n.shownOn).sort((a, b) => a.shownOn < b.shownOn ? 1 : -1);
  const got = theirs.filter(n => n.shownOn && n.shownOn <= today()).sort((a, b) => a.shownOn < b.shownOn ? 1 : -1);
  const theirsWaiting = theirs.filter(n => !n.shownOn).length;
  return `<p class="muted" style="margin-top:12px">Write notes for future days. ${on} gets one a day on the home screen, and won't see it before then.</p>
  <div class="acts"><button class="btn pb" data-a="jarwrite">💌 Write a note</button></div>
  ${theirsWaiting ? `<div class="soft">${on} has ${plural(theirsWaiting, 'note')} waiting for you. One a day.</div>` : ''}
  <h2>In your jar <small>${waiting.length}</small></h2>
  <div class="panel">${waiting.map((n, i) => `<div class="row"><div class="main"><p class="hand sm" style="margin:0">${esc(n.text)}</p><div class="s">${i === 0 && !live('jar').some(x => x.by === role && x.shownOn === today()) ? 'Goes out today' : `Goes out in about ${plural(i + 1, 'day')}`}</div></div><button class="x-btn" data-a="del" data-coll="jar" data-id="${n.id}" aria-label="Delete">×</button></div>`).join('') || '<div class="empty">Empty. Write one.</div>'}</div>
  <h2>Notes to you</h2>
  <div class="panel">${got.map(n => `<div class="row"><div class="main"><p class="hand sm" style="margin:0">${esc(n.text)}</p><div class="s">${esc(fmtDW(n.shownOn))}</div></div></div>`).join('') || '<div class="empty">None yet.</div>'}</div>
  <h2>Notes you've sent</h2>
  <div class="panel">${sent.map(n => `<div class="row"><div class="main"><p class="hand sm" style="margin:0">${esc(n.text)}</p><div class="s">${esc(fmtDW(n.shownOn))}. ${n.openedAt ? 'Read 💗' : 'Not opened yet'}</div></div></div>`).join('') || '<div class="empty">None yet.</div>'}</div>`;
}

/* ---------- new actions ---------- */
Object.assign(A, {
  tab(el){
    Store.ui.tab = el.dataset.v; LS.set('peanut.tab', el.dataset.v);
    if (el.dataset.sub) Store.ui.gear = el.dataset.sub;
    if (Store.ui.tab !== 'kloe') Store.flags = [];
    renderApp(); window.scrollTo(0, 0);
  },
  hug(el){
    upsert('hugs', { id: uid('hg'), date: today(), at: isoNow(), by: me() });
    burst(el); toast(`Hug sent to ${nameOf(otherRole(me()))}`);
    setTimeout(renderApp, 700);
  },
  jarwrite(){
    const on = esc(nameOf(otherRole(me())));
    openSheet(`<form data-s="jar"><h3>A note for ${on}</h3>
      <p class="muted small">It goes into the jar. ${on} gets one note a day on the home screen.</p>
      <label class="f"><span>Your note</span><textarea name="text" rows="4" required></textarea></label>
      <div class="acts"><span class="grow"></span><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn pb" type="submit">Put it in the jar</button></div></form>`);
  },
  jaropen(el){ patch('jar', el.dataset.id, { openedAt: isoNow() }); renderApp(); burst($('.paper'), 5); },
  nudgedone(){ upsert('care', { id: uid('cr'), date: today(), what: nudgeFor(today()).replace(/^Psst, Papa\. /, ''), by: me(), src: 'nudge' }); renderApp(); toast('Nice one, Papa'); },
  quickmood(el){
    upsert('checkins', { id: uid('ci'), at: isoNow(), date: today(), mood: +el.dataset.v, energy: null, body: null, sleep: null, moving: '', tags: [], note: '', help: '', by: me() });
    renderApp(); toast(+el.dataset.v <= 2 ? `Saved. ${nameOf('dad')} will see it` : 'Saved. Thank you');
  },
  reminders(){
    const role = me() || 'mom', m = M(), info = icsInfo();
    openSheet(`<form data-s="reminders"><h3>Daily reminders</h3>
      <p class="muted">Peanut is a web page, so it can't buzz your phone by itself. This makes a calendar file with one alert a day, each carrying that day's note. Your phone's calendar does the reminding.</p>
      <div class="qlabel">For</div><div class="chips">
        <label class="tg"><input type="radio" name="role" value="mom" ${role === 'mom' ? 'checked' : ''}><span>${esc(m.mom)}: Peanut's daily note</span></label>
        <label class="tg"><input type="radio" name="role" value="dad" ${role === 'dad' ? 'checked' : ''}><span>${esc(m.dad)}: the daily "Psst, Papa"</span></label></div>
      <div class="two"><label class="f"><span>Time</span><input type="time" name="time" value="${role === 'dad' ? '12:30' : '09:00'}"></label>
        <label class="f"><span>For the next</span><select name="days"><option value="30">30 days</option><option value="60" selected>60 days</option><option value="90">90 days</option></select></label></div>
      ${info && info.until ? `<p class="small muted">This phone has reminders until ${esc(fmtDW(info.until))}.${m.birth && !info.born ? ` ${esc(m.nick)} has arrived since, so make a fresh set for the after-birth notes.` : ''}</p>` : ''}
      <div class="acts"><button class="btn pb block" type="submit">Download calendar file</button></div>
      <p class="small muted">iPhone: in the Calendar app, add a calendar called Peanut first. Then open the downloaded file, tap Add All, and pick Peanut. Deleting that calendar removes them all. Android: open the file with Google Calendar.</p></form>`);
  },
  b(el){
    const v = el.dataset.v;
    if (v === 'L' || v === 'R'){ startFeed(v); toast(`Timer started on the ${SIDE[v]}`); }
    else if (v === 'bottle') return openLogSheet('feed', 'bottle');
    else if (v === 'wet' || v === 'dirty' || v === 'both'){ const t = isoNow(); upsert('log', { id: uid('lg'), type: 'diaper', diaper: v, at: t, end: t, by: me() }); toast(v === 'wet' ? 'Wet diaper logged' : v === 'dirty' ? 'Poo logged' : 'Wet and poo logged'); }
    else if (v === 'sleep'){ const s = runningOf('sleep'); if (s){ patch('log', s.id, { end: isoNow() }); toast('Good morning, ' + M().nick); } else { upsert('log', { id: uid('lg'), type: 'sleep', at: isoNow(), end: null, by: me() }); toast('Sweet dreams'); } }
    else if (v === 'more') return openSheet(`<div class="sheet-pad"><h3>Log something else</h3><div class="qgrid">
        ${[['pump','','🥛','Pump'],['growth','','⚖️','Growth'],['temp','','🌡️','Temp'],['note','','📝','Note'],['feed','breast','🤱','Past feed'],['sleep','','😴','Past sleep'],['feed','bottle','🍼','Bottle']].map(([t, k, e, l]) => `<button class="qb" data-a="bnew" data-type="${t}" data-kind="${k}"><em>${e}</em><span>${l}</span></button>`).join('')}
        </div><div class="acts"><span class="grow"></span><button class="btn ghost" data-a="close">Close</button></div></div>`);
    renderApp();
  },
  bnew(el){
    const t = el.dataset.type, k = el.dataset.kind || undefined;
    const preset = t === 'feed' && k === 'breast' ? { at: new Date(now() - 15 * 60000).toISOString(), mins: 15 } : t === 'sleep' ? { at: new Date(now() - 3600000).toISOString(), end: isoNow() } : {};
    openLogSheet(t, k, null, preset);
  },
  bedit(el){ openLogSheet(null, null, el.dataset.id); },
  bdel(el){ if (!confirm('Delete this entry?')) return; removeRec('log', el.dataset.id); closeSheet(); renderApp(); toast('Deleted'); },
  bstop(el){ patch('log', el.dataset.id, { end: isoNow() }); renderApp(); toast('Saved'); },
  bswitch(el){ const f = D().log.find(x => x.id === el.dataset.id); startFeed(f && f.side === 'L' ? 'R' : 'L'); renderApp(); toast('Switched sides'); },
  bclear(){ if (!confirm('Clear all practice entries from the baby log?')) return; live('log').filter(l => l.type !== 'contraction').forEach(l => removeRec('log', l.id)); renderApp(); },
  ctr(){ const c = runningOf('contraction'); if (c) patch('log', c.id, { end: isoNow() }); else upsert('log', { id: uid('lg'), type: 'contraction', at: isoNow(), end: null, by: me() }); renderApp(); },
  ctrclear(){ if (!confirm('Clear all contractions?')) return; logs('contraction').forEach(l => removeRec('log', l.id)); renderApp(); },
  mlchip(el){ const f = el.closest('form'); if (f) f.elements.ml.value = el.dataset.v; },
});
Object.assign(S, {
  jar(f){
    const t = f.text.value.trim(); if (!t) return;
    upsert('jar', { id: uid('jr'), text: t, by: me(), created: now(), shownOn: '', openedAt: '' });
    closeSheet(); renderApp(); toast('In the jar 💌');
  },
  reminders(f){
    const role = f.elements.role.value, days = +f.elements.days.value || 60;
    download(buildICS(role, f.elements.time.value || '09:00', days), role === 'mom' ? 'peanut-daily-notes.ics' : 'peanut-psst-papa.ics', 'text/calendar');
    LS.set('peanut.ics', JSON.stringify({ until: addDays(today(), days - 1), born: !!M().birth }));
    closeSheet(); renderApp(); toast('Downloaded. Open it to add to your calendar');
  },
  logsave(f){
    const id = f.dataset.id, T = f.dataset.type, K = f.dataset.kind || undefined;
    const r = id ? { ...D().log.find(x => x.id === id) } : { id: uid('lg'), type: T, kind: K, by: me() };
    const v = n => f.elements[n] ? f.elements[n].value.trim() : undefined;
    const iso = s => s ? new Date(s).toISOString() : '';
    if (v('at') !== undefined) r.at = iso(v('at')) || isoNow();
    if (v('end') !== undefined) r.end = iso(v('end')) || null;
    if (v('mins') !== undefined) r.end = v('mins') === '' ? null : new Date(Date.parse(r.at) + (+v('mins')) * 60000).toISOString();
    if (v('secs') !== undefined) r.end = v('secs') === '' ? null : new Date(Date.parse(r.at) + (+v('secs')) * 1000).toISOString();
    for (const k of ['ml', 'kg', 'cm', 'head', 'c']) if (v(k) !== undefined) r[k] = v(k) === '' ? null : +v(k);
    for (const k of ['side', 'milk', 'diaper', 'note']) if (v(k) !== undefined) r[k] = v(k);
    const timed = T === 'sleep' || T === 'contraction' || (T === 'feed' && K !== 'bottle');
    if (!timed) r.end = r.at;
    if (T === 'temp' && (r.c == null || isNaN(r.c))) return toast('Add the temperature');
    if (r.end && Date.parse(r.end) < Date.parse(r.at)) return toast('The end is before the start');
    upsert('log', r); closeSheet(); renderApp(); toast('Saved');
  },
});

if (!window.crypto?.subtle){
